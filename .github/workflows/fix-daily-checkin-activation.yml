name: Fix Daily Check-in activation lock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Daily Check-in activation lock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove activation requirement from Daily Check-in
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'disabled={busy==="checkin"||!activated}'
          new = 'disabled={busy==="checkin"}'
          if old not in s:
              raise SystemExit('Expected Daily Check-in activation lock was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx .github/workflows/fix-daily-checkin-activation.yml
          git commit -m 'Fix Daily Check-in activation lock'
          git rm .github/workflows/fix-daily-checkin-activation.yml
          git commit -m 'Remove temporary check-in fix workflow'
          git push
